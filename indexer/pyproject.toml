[build-system]
requires = ["setuptools>=68,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "epdn-indexer"
version = "0.1.0"
description = "Rebuildable SQLite read model and privacy-safe export for EPDN"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["cryptography>=42,<50"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
epdn-indexer = "epdn_indexer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["epdn_indexer*"]
